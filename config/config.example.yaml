# Champion configuration example.
# Copy to config/config.yaml and edit. config/config.yaml is git-ignored.
# Any key you leave out uses the built-in default (champion/core/config.py).
# Relative paths: execution.working_directory is relative to the folder you start
# Champion from; all other paths are relative to the project root (the folder
# that contains config/).
# The API token is NOT set here: put it in the environment variable named by
# llm.api_key_env (DATABRICKS_TOKEN below; OPENAI_API_KEY for provider openai)
# or in a .env file in the project root (chmod 600 .env).

llm:
  provider: DATABRICKS              # openai (OpenAI API) or databricks (workspace Unity AI Gateway)
  model_id: system.ai.claude-haiku-4-5              # efficient model; supports tool calling
  model_ids:                        # additional models; runtime fallback is not implemented yet
    # Claude
    - system.ai.claude-haiku-5-5
    - system.ai.claude-sonnet-4-5
    - system.ai.claude-sonnet-4-6
    - system.ai.claude-sonnet-5
    - system.ai.claude-sonnet-5-5
    - system.ai.claude-opus-4-6
    - system.ai.claude-opus-4-7
    - system.ai.claude-opus-4-8
    - system.ai.claude-opus-5
    - system.ai.claude-opus-5-5
    - system.ai.claude-opus-4-5
    - system.ai.gpt-oss-120b
    - system.ai.gpt-oss-20b
  api_key_env: DATABRICKS_TOKEN     # name of the environment variable containing the API token
  base_url: https://adb-5678659344564033.13.azuredatabricks.net/ai-gateway/mlflow/v1                   # null = api.openai.com (set later for a gateway)
  tracing: false                    # true would send SDK traces to OpenAI

orchestration:
  max_steps: 8                      # orchestrator turns per request
  specialist_max_turns: 20          # turns inside one specialist call
  history_turns: 10                 # earlier conversation turns sent with each request
  prevent_repeated_action: true

policy:
  default_level: "1.1"              # 1.1, 1.2, 2.1, 2.2 or custom (quote the number)
  custom:                           # used when the level is custom
    read: working                   # none, working or outside
    write: none                     # none, working or outside (not wider than read)
    extra_dirs: []                  # extra folders allowed for read (and write if allowed)

access:                             # step 4e: per-folder access (read or edit per folder)
  preset: null                      # starting preset 1.1, 1.2, 2.1, 2.2 or custom; null = policy.default_level
  working: null                     # working folder: none, read or edit; null = from the preset
  outside: null                     # everything else outside the folders: none, read or edit
  folders: []                       # e.g. - {path: /data/lsdyna/models, right: read}
                                    #      - {path: /scratch/me/runs, right: edit}
  file: ~/.champion/access.yaml     # where /access save keeps your list; null = saving off

execution:
  working_directory: .
  require_approval: true            # deletes (rm) ask every time; false = deletes are refused, never auto-run
  timeout_seconds: 120              # wall time per shell command / pipeline
  max_output_chars: 12000           # text a tool may return to the model per call
  max_memory_bytes: 4294967296      # 4 GiB per command / generated code
  max_cpu_seconds: 300
  max_output_file_bytes: 104857600  # 100 MiB largest file generated code may write
  max_command_file_bytes: 8589934592  # 8 GiB largest file a shell command may write (cp of a model)

edit:
  full_backup: false                # true = full copy before editing a large deck
  # A higher-risk file_edit asks once (Approve? [y/N]; refused with -q):
  approval_max_deleted_lines: 100   # more lines deleted than this
  approval_max_changed_fraction: 0.2  # more of the file changed than this ...
  approval_min_bytes: 8192          # ... for files of at least this size (small files: lines rule only)

storage:
  audit_db: champion.db
  log_dir: logs

agents:
  pydyna:
    enabled: true
  linux_coder:
    enabled: true

pydyna:
  database_path: null               # existing Chroma vector_db folder (step 3)
  keyword_reference_path: null      # knowledge-base/keyword_reference.jsonl (step 3)
  python_path: null                 # Python with ansys-dyna-core (step 8)
  large_file_bytes: 104857600       # 100 MiB: files this size or larger use large-file mode
  max_model_bytes: 8589934592       # 8 GiB: larger files are refused
  max_include_files: 1024
  max_include_depth: 64
  model_timeout_seconds: 120
  max_memory_bytes: 4294967296

kb:
  sources:
    pydyna: null                    # local checkout of the PyDyna repository
    pydpf_post: null                # local checkout of the PyDPF-Post repository
  max_source_file_bytes: 2097152    # 2 MiB: larger source files are skipped

mcp:
  enabled: false
  servers: {}
